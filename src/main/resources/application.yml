spring:
  application:
    name: tostrip-v1

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5435/postgres}
    username: ${DB_USERNAME:test}
    password: ${DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 5MB

file-upload:
  server-path: ${FILE_UPLOAD_PATH:D://TosTrip//tos-trip-upload//}
  base-uri: ${FILE_BASE_URI:http://localhost:8080/images/}