spring:
  config:
    activate:
      on-profile: docker

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

file-upload:
  server-path: ${FILE_UPLOAD_PATH:/upload/}
  base-uri: ${FILE_BASE_URI:https://derleng-api.eunglyzhia.social/images/}